name: tag

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.bump.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the next patch tag
        id: bump
        run: |
          if [ -n "$(git tag --points-at HEAD 'v*')" ]; then
            echo "HEAD is already tagged, nothing to do"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest" ]; then
            next=v0.1.0
          else
            IFS=. read -r major minor patch <<EOF
          ${latest#v}
          EOF
            next="v$major.$minor.$((patch + 1))"
          fi
          git tag "$next"
          git push origin "$next"
          echo "Tagged $next"
          echo "created=true" >> "$GITHUB_OUTPUT"

  # A tag pushed with GITHUB_TOKEN does not trigger other workflows, so the
  # release is called from here instead of relying on its tag trigger.
  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
